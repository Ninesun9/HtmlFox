name: HtmlFox
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.htmlfox.ios
    DEVELOPMENT_TEAM: ""
targets:
  HtmlFox:
    type: application
    platform: iOS
    sources:
      - path: HtmlFoxIOS
        excludes:
          - Scripts
          - Resources
    resources:
      - path: HtmlFoxIOS/Scripts
      - path: HtmlFoxIOS/Resources
    settings:
      base:
        INFOPLIST_FILE: HtmlFoxIOS/Resources/Info.plist
        PRODUCT_NAME: HtmlFox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
